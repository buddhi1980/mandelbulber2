# https://circleci.com/docs/2.0/
version: 2.1

# One job per kind of Mac hardware. CircleCI's Macs are Apple Silicon, so the
# arm64 job builds natively and the x86_64 job builds for Intel Macs under
# Rosetta 2.
#
# No Homebrew: mandelbulber2/mac/build_deps.sh builds the libraries from
# source for an older macOS and installs Qt's official build. The result is
# cached and only rebuilt when build_deps.sh changes.
commands:
  build-and-pack-steps:
    parameters:
      arch:
        type: enum
        enum: [arm64, x86_64]
    steps:
      - checkout
      - restore_cache:
          keys:
            - mac-deps-v1-<< parameters.arch >>-{{ checksum "mandelbulber2/mac/build_deps.sh" }}
      - run:
          name: Dependencies
          command: |
            if [ "<< parameters.arch >>" = "x86_64" ]; then
              # Rosetta 2 runs the Intel build on the Apple Silicon machine
              softwareupdate --install-rosetta --agree-to-license || true
            fi
            # does nothing when the cache already holds a finished build
            ~/mandelbulber2/mandelbulber2/mac/build_deps.sh ~/mac-deps
      - save_cache:
          key: mac-deps-v1-<< parameters.arch >>-{{ checksum "mandelbulber2/mac/build_deps.sh" }}
          paths:
            - ~/mac-deps
      - run:
          name: Build and Pack
          command: |
            ~/mandelbulber2/mandelbulber2/mac/build_package.sh ~/mac-deps ~/mandelbulber2/build \
              mandelbulber2-macOS-<< parameters.arch >>-$CIRCLE_SHA1
      - store_artifacts:
          path: ~/mandelbulber2/build/artifacts/

jobs:
  # Apple Silicon Macs
  build-and-pack:
    macos:
      xcode: 27.0
    working_directory: ~/mandelbulber2/
    environment:
      ARCH: arm64
      MACOSX_DEPLOYMENT_TARGET: "11.0"
    steps:
      - build-and-pack-steps:
          arch: arm64
  # Intel Macs
  build-and-pack-intel:
    macos:
      xcode: 27.0
    working_directory: ~/mandelbulber2/
    environment:
      ARCH: x86_64
      MACOSX_DEPLOYMENT_TARGET: "11.0"
    steps:
      - build-and-pack-steps:
          arch: x86_64

# TODO: Build App Store version on CI

workflows:
  version: 2
  build-and-deploy:
    jobs:
      - build-and-pack
      - build-and-pack-intel
