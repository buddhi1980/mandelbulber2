# https://circleci.com/docs/2.0/
version: 2.1

# Builds for macOS, Linux and Windows. The Linux and Windows jobs mirror the
# GitHub Actions workflows in .github/workflows; keep the two in step.
#
# macOS: one job per kind of Mac hardware. CircleCI's Macs are Apple Silicon, so the
# arm64 job builds natively and the x86_64 job builds for Intel Macs under
# Rosetta 2.
#
# No Homebrew: mandelbulber2/mac/build_deps.sh builds the libraries from
# source for an older macOS and installs Qt's official build. The result is
# cached and only rebuilt when build_deps.sh changes.
#
# Every job also runs the regression test of .github/scripts/regression-compare.*:
# it builds the previous commit as well, renders the regression scenes with
# both builds and compares them (on Windows in the Release job only).
#
# Job names are <system>-<architecture>, with the configuration added on
# Windows: macos-arm64, macos-x86_64, linux-x86_64, windows-x64-Release,
# windows-x64-Debug and windows-x64-AnalysisRelease.
jobs:
  # macOS app bundle and disk image: arm64 for Apple Silicon Macs, x86_64 for Intel Macs
  macos:
    parameters:
      arch:
        type: enum
        enum: [arm64, x86_64]
    macos:
      xcode: 27.0
    working_directory: ~/mandelbulber2/
    environment:
      ARCH: << parameters.arch >>
      MACOSX_DEPLOYMENT_TARGET: "11.0"
    steps:
      - checkout
      - restore_cache:
          keys:
            - mac-deps-v1-<< parameters.arch >>-{{ checksum "mandelbulber2/mac/build_deps.sh" }}
      - run:
          name: Dependencies
          command: |
            if [ "<< parameters.arch >>" = "x86_64" ]; then
              # Rosetta 2 runs the Intel build on the Apple Silicon machine
              softwareupdate --install-rosetta --agree-to-license || true
            fi
            # does nothing when the cache already holds a finished build
            ~/mandelbulber2/mandelbulber2/mac/build_deps.sh ~/mac-deps
      - save_cache:
          key: mac-deps-v1-<< parameters.arch >>-{{ checksum "mandelbulber2/mac/build_deps.sh" }}
          paths:
            - ~/mac-deps
      - run:
          name: Build and Pack
          command: |
            ~/mandelbulber2/mandelbulber2/mac/build_package.sh ~/mac-deps ~/mandelbulber2/build \
              mandelbulber2-macOS-<< parameters.arch >>-$CIRCLE_SHA1
      - store_artifacts:
          path: ~/mandelbulber2/build/artifacts/
      - run:
          name: Regression Test
          no_output_timeout: 60m
          command: |
            DEPS=~/mac-deps .github/scripts/regression-compare.sh \
              ~/mandelbulber2/build/mandelbulber2.app/Contents/MacOS/mandelbulber2 \
              "<< pipeline.git.base_revision >>"
      - store_artifacts:
          path: ~/mandelbulber2/regression/
          destination: regression

  # Linux: the same steps as .github/workflows/linux.yml. The
  # AppImage is kept as an artifact here; the GitHub workflow is the one that
  # publishes it as the continuous release.
  linux-x86_64:
    machine:
      image: ubuntu-2404:current
    resource_class: large
    working_directory: ~/mandelbulber2/
    environment:
      DEBIAN_FRONTEND: noninteractive
      # QtTest stops a test after 5 minutes by default; allow 30 minutes
      QTEST_FUNCTION_TIMEOUT: "1800000"
      # the AppImage tools run without FUSE
      APPIMAGE_EXTRACT_AND_RUN: "1"
    steps:
      - checkout
      - run:
          name: Install System Dependencies
          command: |
            sudo apt-get -qq update
            sudo apt-get install -y \
              build-essential \
              pkg-config \
              mesa-common-dev \
              libgl1-mesa-dev \
              libpng-dev \
              libgsl-dev \
              libgomp1 \
              liblzo2-2 \
              liblzo2-dev \
              libtiff-dev \
              libopenexr-dev \
              libjxl-dev \
              libsndfile1-dev \
              tree \
              wget \
              opencl-headers \
              opencl-clhpp-headers \
              ocl-icd-libopencl1 \
              ocl-icd-opencl-dev
      - run:
          name: Install Qt6 Components
          command: |
            sudo apt-get install -y \
              qt6-base-dev \
              qt6-tools-dev \
              qt6-multimedia-dev \
              qt6-svg-dev \
              qt6-tools-dev-tools \
              qt6-declarative-dev
      - run:
          name: Build and Install Application
          no_output_timeout: 30m
          command: |
            cd ~/mandelbulber2/mandelbulber2
            ./deploy/linux/install --opencl --build-dir "$PWD/build" --jobs "$(nproc)"
      - run:
          name: Run Tests
          no_output_timeout: 30m
          command: mandelbulber2 --test
      - run:
          name: Regression Test
          no_output_timeout: 30m
          command: .github/scripts/regression-compare.sh mandelbulber2 "<< pipeline.git.base_revision >>"
      - store_artifacts:
          path: ~/mandelbulber2/regression/
          destination: regression
      - run:
          name: Build AppImage
          command: |
            cd ~/mandelbulber2/mandelbulber2/build
            make INSTALL_ROOT=appdir -j$(nproc) install
            find appdir/
            cp appdir/usr/share/icons/hicolor/256x256/apps/mandelbulber.png appdir/usr/share/icons/hicolor/256x256/apps/mandelbulber2.png || true
            cp appdir/usr/share/icons/hicolor/256x256/apps/mandelbulber.png appdir/mandelbulber.png
            wget -c -nv "https://github.com/linuxdeploy/linuxdeploy/releases/download/continuous/linuxdeploy-x86_64.AppImage"
            chmod a+x linuxdeploy-x86_64.AppImage
            wget -c -nv "https://github.com/linuxdeploy/linuxdeploy-plugin-qt/releases/download/continuous/linuxdeploy-plugin-qt-x86_64.AppImage"
            chmod a+x linuxdeploy-plugin-qt-x86_64.AppImage
            unset QTDIR; unset QT_PLUGIN_PATH; unset LD_LIBRARY_PATH
            export QMAKE=/usr/bin/qmake6
            ./linuxdeploy-x86_64.AppImage --appimage-extract-and-run \
              --appdir appdir \
              --plugin qt \
              --output appimage \
              --desktop-file appdir/usr/share/applications/*.desktop
            mkdir -p ~/mandelbulber2/artifacts
            cp Mandelbulber*.AppImage* ~/mandelbulber2/artifacts/
            ls -lh ~/mandelbulber2/artifacts
      - store_artifacts:
          path: ~/mandelbulber2/artifacts/

  # Windows: the same steps as .github/workflows/windows.yml, once per
  # configuration. CircleCI's Windows machines come with Visual Studio 2022,
  # and the projects use the v145 toolset, so the job first installs the
  # Visual Studio 2026 Build Tools.
  windows-x64:
    parameters:
      configuration:
        type: enum
        enum: [Release, Debug, AnalysisRelease]
    machine:
      image: windows-server-2022-gui:current
      resource_class: windows.medium
      shell: powershell.exe -ExecutionPolicy Bypass
    environment:
      CONFIGURATION: << parameters.configuration >>
      PLATFORM: x64
    steps:
      - checkout
      - run:
          name: Install Visual Studio 2026 Build Tools
          no_output_timeout: 60m
          command: |
            choco install visualstudio2026buildtools --no-progress -y `
              --package-parameters "--add Microsoft.VisualStudio.Workload.VCTools --includeRecommended --locale en-US"
            $result = $LASTEXITCODE
            Write-Host "Installer exit code: $result"
            # 3010 means installed, restart wanted
            if ($result -ne 0 -and $result -ne 3010) {
              # the Visual Studio installer explains a failure only in its own logs
              Get-ChildItem "$env:TEMP\dd_*.log" -ErrorAction SilentlyContinue | Sort-Object LastWriteTime | Select-Object -Last 4 | ForEach-Object {
                Write-Host "===== $($_.Name)"
                Get-Content $_.FullName -Tail 60
              }
              exit $result
            }
            $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
            $msbuild = & $vswhere -products * -version '[18.0,19.0)' -requires Microsoft.Component.MSBuild -find 'MSBuild\**\Bin\MSBuild.exe' | Select-Object -First 1
            if (-not $msbuild) { Write-Error 'MSBuild of Visual Studio 2026 not found'; exit 1 }
            & $msbuild -version
      - run:
          name: Install Inno Setup and NuGet
          command: |
            # mandelbulber2.vcxproj builds the installer when Inno Setup 6 is at its usual place
            choco install innosetup nuget.commandline --no-progress -y
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            if (-not (Test-Path 'C:\Program Files (x86)\Inno Setup 6\ISCC.exe')) { Write-Error 'Inno Setup compiler not found'; exit 1 }
      - restore_cache:
          keys:
            - nuget-msvc-v1-{{ checksum "mandelbulber2/msvc/packages.config" }}
      - run:
          name: Restore NuGet Packages
          command: |
            nuget restore mandelbulber2\msvc\mandelbulber2.sln
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - save_cache:
          key: nuget-msvc-v1-{{ checksum "mandelbulber2/msvc/packages.config" }}
          paths:
            - mandelbulber2/msvc/packages
      - run:
          name: Build Application and Installer
          no_output_timeout: 120m
          command: |
            Write-Host "BUILD $env:CONFIGURATION $env:PLATFORM"
            $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
            $msbuild = & $vswhere -products * -version '[18.0,19.0)' -requires Microsoft.Component.MSBuild -find 'MSBuild\**\Bin\MSBuild.exe' | Select-Object -First 1
            New-Item -ItemType Directory -Force build-logs | Out-Null
            & $msbuild mandelbulber2\msvc\mandelbulber2.sln /m "/p:Configuration=$env:CONFIGURATION" "/p:Platform=$env:PLATFORM" `
              "/flp:LogFile=build-logs\msbuild.log;Verbosity=normal;Encoding=UTF-8" `
              "/flp1:LogFile=build-logs\msbuild-warnings.log;WarningsOnly;Encoding=UTF-8" `
              "/flp2:LogFile=build-logs\msbuild-errors.log;ErrorsOnly;Encoding=UTF-8"
            $result = $LASTEXITCODE
            # the findings of the build, by rule and by file; the full list is findings.csv
            .\.github\scripts\summarize-msvc-warnings.ps1 -LogDir build-logs -Title "$env:CONFIGURATION $env:PLATFORM" `
              -ArtifactName 'build-logs' -Root (Get-Location).Path -SummaryFile build-logs\summary.md
            if ($result -ne 0) {
              Write-Host 'TRY AND TRY AGAIN'
              if ($env:CONFIGURATION -ne 'Release') {
                # as on AppVeyor, a Debug or AnalysisRelease failure does not fail the build
                Write-Host "$env:CONFIGURATION failed to build; this configuration is allowed to fail"
                New-Item -ItemType File -Force build-logs\allowed-failure.txt | Out-Null
                exit 0
              }
              exit $result
            }
            Write-Host 'BUILD VICTORY'
      - run:
          name: Check Installer and Zip Build Archive
          command: |
            if (Test-Path build-logs\allowed-failure.txt) { Write-Host 'Nothing to pack: the build failed'; exit 0 }
            $buildDir = "build-win\$env:CONFIGURATION\$env:PLATFORM"
            $setup = @(Get-ChildItem -Path "build-win\Setup\$env:CONFIGURATION\$env:PLATFORM" -Filter '*-Setup.exe' -ErrorAction SilentlyContinue)
            if ($setup.Count -ne 1) { Write-Error "Expected one installer, found $($setup.Count)"; exit 1 }
            New-Item -ItemType Directory -Force artifacts | Out-Null
            $suffix = ''
            if ($env:CONFIGURATION -ne 'Release') { $suffix = "-$env:CONFIGURATION" }
            Copy-Item $setup[0].FullName "artifacts\$($setup[0].BaseName)$suffix.exe"
            tree /F $buildDir | Out-File build-logs\build-tree.txt -Encoding utf8
            Compress-Archive -Path $buildDir -DestinationPath "artifacts\mandelbulber-$env:CONFIGURATION-$env:PLATFORM-$env:CIRCLE_SHA1.zip"
            Get-ChildItem artifacts | Format-Table Name, Length
      - store_artifacts:
          path: artifacts
      - store_artifacts:
          path: build-logs
      # the Debug build renders too slowly, and AnalysisRelease is for the code analysis
      - when:
          condition:
            equal: [Release, << parameters.configuration >>]
          steps:
            - run:
                name: Regression Test
                no_output_timeout: 120m
                command: |
                  .\.github\scripts\regression-compare.ps1 -Base "<< pipeline.git.base_revision >>" `
                    -Configuration $env:CONFIGURATION -Platform $env:PLATFORM
                  exit $LASTEXITCODE
            - store_artifacts:
                path: regression
                destination: regression

# TODO: Build App Store version on CI

workflows:
  version: 2
  build:
    jobs:
      - macos:
          name: macos-<< matrix.arch >>
          matrix:
            parameters:
              arch: [arm64, x86_64]
      - linux-x86_64
      - windows-x64:
          name: windows-x64-<< matrix.configuration >>
          matrix:
            parameters:
              configuration: [Release, Debug, AnalysisRelease]
