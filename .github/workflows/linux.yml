name: Linux

# Linux build with Qt 6: build and install through deploy/linux/install, run
# mandelbulber2 --test, compare the regression renders with the base commit,
# and publish the AppImage as the continuous release.

on:
  push:
    branches:
      - '**'
    tags-ignore:
      - 'continuous*'
      - 'Continuous*'
  pull_request:

jobs:
  # job names match the CircleCI jobs: <system>-<architecture>
  linux-x86_64:
    name: linux-x86_64
    runs-on: ubuntu-24.04
    env:
      CONFIG: release

    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Install System Dependencies
        run: |
          sudo apt-get -qq update
          sudo apt-get install -y \
            build-essential \
            pkg-config \
            mesa-common-dev \
            libgl1-mesa-dev \
            libpng-dev \
            libgsl-dev \
            libgomp1 \
            liblzo2-2 \
            liblzo2-dev \
            libtiff-dev \
            libopenexr-dev \
            libjxl-dev \
            libsndfile1-dev \
            tree \
            wget \
            opencl-headers \
            opencl-clhpp-headers \
            ocl-icd-libopencl1 \
            ocl-icd-opencl-dev

      - name: Install Qt6 Components
        run: |
          sudo apt-get install -y \
            qt6-base-dev \
            qt6-tools-dev \
            qt6-multimedia-dev \
            qt6-svg-dev \
            qt6-tools-dev-tools \
            qt6-declarative-dev

      # deploy/linux/install is the script users build and install with. It
      # compiles the OpenCL variant into mandelbulber2/build and installs it to
      # /usr, so the tests run on the installed program and the AppImage step
      # reuses the same build.
      - name: Build & Install Application
        run: |
          cd mandelbulber2
          ./deploy/linux/install --opencl --build-dir "$PWD/build" --jobs "$(nproc)"

      # QtTest stops a test after 5 minutes by default, which the example
      # renders alone nearly use up on a hosted runner; allow 30 minutes
      - name: Run Tests
        env:
          QTEST_FUNCTION_TIMEOUT: '1800000'
        run: mandelbulber2 --test

      # Regression test: build the commit before this change as well, render the
      # regression scenes with both builds and compare them. The images and the
      # report are uploaded as the artifact regression-images. It is skipped,
      # with a notice, when there is no base commit, when the base has no
      # regression test yet, or when the base does not build.
      - name: Find Regression Base
        id: regression
        run: |
          base="${{ github.event.pull_request.base.sha || github.event.before }}"
          if [ -z "$base" ] || [ "$base" = "0000000000000000000000000000000000000000" ]; then
            echo "::notice::Regression comparison skipped: this run has no base commit"
            echo "ready=0" >> "$GITHUB_OUTPUT"
          elif ! git fetch --depth 1 origin "$base"; then
            echo "::notice::Regression comparison skipped: base commit $base cannot be fetched"
            echo "ready=0" >> "$GITHUB_OUTPUT"
          elif ! git cat-file -e "$base:mandelbulber2/src/regression_test.cpp"; then
            echo "::notice::Regression comparison skipped: base commit $base has no regression test"
            echo "ready=0" >> "$GITHUB_OUTPUT"
          else
            echo "base=$base" >> "$GITHUB_OUTPUT"
            echo "ready=1" >> "$GITHUB_OUTPUT"
          fi

      # the base is compiled with its own install script, but not installed
      - name: Build Regression Base
        id: regression_base
        if: steps.regression.outputs.ready == '1'
        run: |
          git worktree add --detach ../regression-base "${{ steps.regression.outputs.base }}"
          cd ../regression-base/mandelbulber2
          if ./deploy/linux/install --opencl --no-deps --no-install --build-dir "$PWD/build" --jobs "$(nproc)"; then
            echo "ready=1" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::Regression comparison skipped: the base commit does not build"
            echo "ready=0" >> "$GITHUB_OUTPUT"
          fi

      # both builds read the scenes that the install step put into /usr/share
      - name: Compare Renders With Base
        if: steps.regression_base.outputs.ready == '1'
        run: |
          mkdir -p regression
          ../regression-base/mandelbulber2/build/mandelbulber2 --nogui --regression-render regression/before || true
          mandelbulber2 --nogui --regression-render regression/after || true
          mandelbulber2 --nogui --regression-compare regression/before regression/after --output regression/comparison

      - name: Upload Regression Images
        if: always() && steps.regression_base.outputs.ready == '1'
        uses: actions/upload-artifact@v7
        with:
          name: regression-images
          path: regression/

      - name: Build & Upload AppImage (Qt6 Compatible)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd mandelbulber2/build
          make INSTALL_ROOT=appdir -j$(nproc) install
          find appdir/
          
          # Fix icon paths from your original script
          cp appdir/usr/share/icons/hicolor/256x256/apps/mandelbulber.png appdir/usr/share/icons/hicolor/256x256/apps/mandelbulber2.png || true
          cp appdir/usr/share/icons/hicolor/256x256/apps/mandelbulber.png appdir/mandelbulber.png
          
          # 1. Download modern linuxdeploy core (Qt6 compatible bundle pipeline)
          wget -c -nv "https://github.com/linuxdeploy/linuxdeploy/releases/download/continuous/linuxdeploy-x86_64.AppImage"
          chmod a+x linuxdeploy-x86_64.AppImage
          
          # 2. Download the mandatory Qt plugin for linuxdeploy
          wget -c -nv "https://github.com/linuxdeploy/linuxdeploy-plugin-qt/releases/download/continuous/linuxdeploy-plugin-qt-x86_64.AppImage"
          chmod a+x linuxdeploy-plugin-qt-x86_64.AppImage
          
          # Clean environment variables to prevent local host leakage
          unset QTDIR; unset QT_PLUGIN_PATH; unset LD_LIBRARY_PATH
          
          # 3. Tell linuxdeploy to extract and bundle using the Qt plugin
          export QMAKE=/usr/bin/qmake6
          ./linuxdeploy-x86_64.AppImage --appimage-extract-and-run \
            --appdir appdir \
            --plugin qt \
            --output appimage \
            --desktop-file appdir/usr/share/applications/*.desktop
          
          # 4. Corrected community uploadtool link
          wget -c -nv "https://github.com/probonopd/uploadtool/raw/master/upload.sh"
          export UPLOADTOOL_ISPRERELEASE=true
          bash upload.sh Mandelbulber*.AppImage*
