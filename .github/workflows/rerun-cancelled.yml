name: Rerun Cancelled

# Reruns the cancelled jobs of a run of the build, regression and CodeQL workflows, up to 3
# times, when the commit it ran on is still the latest commit of its branch. A run that a
# newer push replaced (the workflows cancel runs in progress on a new push) is not rerun,
# because the newer commit gets its own run. A job cancelled for another reason, such as a
# lost runner or a runner GitHub couldn't provide (macOS arm64 runners are sometimes short),
# is retried up to 3 times (4 attempts in all). Such a run ends as cancelled, or as failed
# when only some of its jobs were cancelled; a run with a job that really failed is not
# rerun. Only the cancelled jobs (and the jobs that need them) run again, so the jobs that
# finished keep their results.
#
# Only runs started by a push are considered; a pull request gets a new run
# with every push to it.

on:
  workflow_run:
    # every workflow that builds Mandelbulber: the Linux, Windows and macOS builds,
    # the regression test, and the CodeQL analysis
    workflows: [Linux, Windows, macOS, Regression, CodeQL Advanced]
    types: [completed]

permissions:
  actions: write
  contents: read

jobs:
  rerun:
    name: rerun
    if: >-
      (github.event.workflow_run.conclusion == 'cancelled' ||
       github.event.workflow_run.conclusion == 'failure') &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.run_attempt <= 3
    runs-on: ubuntu-24.04
    steps:
      - name: Rerun If Still the Latest Commit
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          RUN_ID: ${{ github.event.workflow_run.id }}
          RUN_NAME: ${{ github.event.workflow_run.name }}
          RUN_SHA: ${{ github.event.workflow_run.head_sha }}
          ATTEMPT: ${{ github.event.workflow_run.run_attempt }}
          BRANCH: ${{ github.event.workflow_run.head_branch }}
        run: |
          jobs="$(gh api "repos/$REPO/actions/runs/$RUN_ID/attempts/$ATTEMPT/jobs?per_page=100" \
            --paginate --jq '.jobs[].conclusion')"
          if grep -qE '^(failure|timed_out)$' <<< "$jobs"; then
            echo "$RUN_NAME run $RUN_ID has a failed job, so it is not rerun"
            exit 0
          fi
          if ! grep -q '^cancelled$' <<< "$jobs"; then
            echo "$RUN_NAME run $RUN_ID has no cancelled job, so it is not rerun"
            exit 0
          fi
          latest="$(gh api "repos/$REPO/branches/$BRANCH" --jq .commit.sha 2>/dev/null || true)"
          if [ "$latest" != "$RUN_SHA" ]; then
            echo "$RUN_NAME run $RUN_ID on $BRANCH is for ${RUN_SHA:0:9}, but the branch is at ${latest:0:9}: a newer push replaced it, so it is not rerun"
            exit 0
          fi
          echo "$RUN_NAME run $RUN_ID on $BRANCH has cancelled jobs on the latest commit ${RUN_SHA:0:9}; retry $ATTEMPT of 3"
          gh run rerun "$RUN_ID" --repo "$REPO" --failed
