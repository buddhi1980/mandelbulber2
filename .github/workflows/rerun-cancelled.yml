name: Rerun Cancelled

# Reruns a cancelled run of the build and regression workflows once, when the
# commit it ran on is still the latest commit of its branch. A run that a newer
# push replaced (the workflows cancel runs in progress on a new push) is not
# rerun, because the newer commit gets its own run. A run cancelled for another
# reason, such as a lost runner, gets one more attempt.
#
# Only runs started by a push are considered; a pull request gets a new run
# with every push to it.

on:
  workflow_run:
    workflows: [Linux, Windows, macOS, Regression]
    types: [completed]

permissions:
  actions: write
  contents: read

jobs:
  rerun:
    name: rerun
    if: >-
      github.event.workflow_run.conclusion == 'cancelled' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.run_attempt < 2
    runs-on: ubuntu-24.04
    steps:
      - name: Rerun If Still the Latest Commit
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          RUN_ID: ${{ github.event.workflow_run.id }}
          RUN_NAME: ${{ github.event.workflow_run.name }}
          RUN_SHA: ${{ github.event.workflow_run.head_sha }}
          BRANCH: ${{ github.event.workflow_run.head_branch }}
        run: |
          latest="$(gh api "repos/$REPO/branches/$BRANCH" --jq .commit.sha 2>/dev/null || true)"
          if [ "$latest" != "$RUN_SHA" ]; then
            echo "$RUN_NAME run $RUN_ID on $BRANCH is for ${RUN_SHA:0:9}, but the branch is at ${latest:0:9}: a newer push replaced it, so it is not rerun"
            exit 0
          fi
          echo "$RUN_NAME run $RUN_ID on $BRANCH was cancelled on the latest commit ${RUN_SHA:0:9}; rerunning it"
          gh run rerun "$RUN_ID" --repo "$REPO"
