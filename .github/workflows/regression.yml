name: Regression

# Regression test: renders a fixed list of bundled examples (regression_examples.cpp)
# and the default scene with every fractal formula with a build of this commit
# (head), and compares the renders with those of two older commits
# (mandelbulber2 --regression-render and --regression-compare):
#
#   previous  the pull request's base, or the previous commit of a push, or
#             else the parent commit
#   back10    the commit 10 commits before head, to catch a change that builds
#             up over several commits
#
# It runs on Linux (GCC): the three commits are built once each, then the scenes
# are split over a matrix of shard jobs (--regression-shard K/N), which run in
# parallel. Each shard renders its scenes once with the head build and twice with
# each older build, and compares head with both. Every shard uploads its reports,
# and the images when a scene fails; the summary job lists every result.
# Windows and macOS took longer for the same work (macOS runners also run only
# 5 jobs at once), so they only build and test in windows.yml and macos.yml.
#
# A comparison is skipped, with a notice, when its commit doesn't exist, can't
# render a shard of the scenes yet, would hang on the custom formula, or renders
# the formula scenes at another size than head. After a change to how scenes are
# rendered, the comparisons therefore resume with the next commits.

on:
  push:
    branches:
      - '**'
    tags-ignore:
      - 'continuous*'
      - 'Continuous*'
  pull_request:
  workflow_dispatch:

concurrency:
  group: regression-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # Shards. The scenes take about 4400 seconds to render once (regression-times.txt), split
  # evenly over the shards, so each of 13 shards renders for about 28 minutes on an average
  # runner with both older builds (head once, each older build twice). Runners differ in
  # speed, and some render a few scenes several times slower, so a shard can take half as long
  # again. GitHub runs 20 jobs of this repository at once, and the Linux, Windows and macOS
  # build workflows of the same push hold 7 of them, so 13 shards all start at once: with 16,
  # three waited up to 15 minutes for a runner and the run took just over an hour.
  LINUX_SHARDS: 13

jobs:
  prepare:
    name: prepare
    runs-on: ubuntu-24.04
    outputs:
      ready: ${{ steps.base.outputs.ready }}
      previous: ${{ steps.base.outputs.previous }}
      back10: ${{ steps.base.outputs.back10 }}
      comparisons: ${{ steps.base.outputs.comparisons }}
      sides: ${{ steps.base.outputs.sides }}
      linux: ${{ steps.shards.outputs.linux }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7
        # head~10 is 12 commits deep from a pull request's merge commit; older commits are
        # fetched when needed
        with:
          fetch-depth: 12

      - name: Find Comparison Commits
        id: base
        run: |
          head="${{ github.event.pull_request.head.sha || github.sha }}"
          previous="${{ github.event.pull_request.base.sha || github.event.before }}"
          if [ -z "$previous" ] || [ "$previous" = "0000000000000000000000000000000000000000" ]; then
            previous="$(git rev-parse -q --verify "$head^" || true)"
          fi
          back10="$(git rev-parse -q --verify "$head~10" || true)"

          # A commit can be compared when it renders a shard of the scenes, skips the custom
          # formula (it has no CPU code, and older builds hang on it), and renders the formula
          # scenes at the same size as head. unusable prints why a commit can't be compared,
          # and nothing when it can.
          unusable() {
            if [ -z "$1" ]; then
              echo "there is no such commit"
              return
            fi
            if ! git cat-file -e "$1^{commit}" 2>/dev/null && ! git fetch -q --depth=1 origin "$1"; then
              echo "commit $1 can't be fetched"
              return
            fi
            local source short
            short="$(git rev-parse --short "$1")"
            source="$(git show "$1:mandelbulber2/src/regression_test.cpp" 2>/dev/null)"
            if [ -z "$source" ]; then
              echo "commit $short has no regression test"
            elif ! grep -q SetShard <<< "$source"; then
              echo "commit $short can't render a shard of the scenes"
            elif ! grep -q "fractal::custom" <<< "$source"; then
              echo "commit $short doesn't skip the custom formula, which hangs its build"
            elif ! grep -q formulaLongSide <<< "$source"; then
              echo "commit $short renders the formula scenes at another size than head"
            fi
          }
          comparisons=""
          reason="$(unusable "$previous")"
          if [ -z "$reason" ]; then
            echo "previous: $(git log -1 --format='%h %s' "$previous")"
            echo "previous=$previous" >> "$GITHUB_OUTPUT"
            comparisons="$comparisons,\"previous\""
          else
            echo "::notice::Comparison with the previous commit skipped: $reason"
          fi
          # back10 is the commit 10 before head. When that commit can't be compared, or can't
          # render a list of scenes (then every shard falls back to scenes in turn, which are
          # not balanced), the oldest commit since then that can do both is compared instead,
          # so the long comparison continues after a change to how the scenes are rendered.
          lists() {
            git show "$1:mandelbulber2/src/command_line_interface.cpp" 2>/dev/null |
              grep -q regression-scenes
          }
          reason="$(unusable "$back10")"
          if [ -n "$reason" ] || ! lists "$back10"; then
            for n in 9 8 7 6 5 4 3 2; do
              candidate="$(git rev-parse -q --verify "$head~$n" || true)"
              if [ -n "$candidate" ] && [ -z "$(unusable "$candidate")" ] && lists "$candidate"; then
                echo "::notice::Comparison with the commit 10 before head uses the commit $n before head, $(git rev-parse --short "$candidate"): ${reason:-the commit 10 before head cannot render a list of scenes}"
                back10="$candidate"
                reason=""
                break
              fi
            done
          fi
          if [ -z "$reason" ]; then
            echo "back10: $(git log -1 --format='%h %s' "$back10")"
            echo "back10=$back10" >> "$GITHUB_OUTPUT"
            comparisons="$comparisons,\"back10\""
          else
            echo "::notice::Comparison with the commit 10 before head skipped: $reason"
          fi
          comparisons="${comparisons#,}"
          if [ -z "$comparisons" ]; then
            echo "ready=0" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "comparisons=[$comparisons]" >> "$GITHUB_OUTPUT"
          echo "sides=[$comparisons,\"head\"]" >> "$GITHUB_OUTPUT"
          echo "ready=1" >> "$GITHUB_OUTPUT"

      - name: List Shards
        id: shards
        run: |
          echo "linux=$(seq -s, 1 "$LINUX_SHARDS" | sed 's/.*/[&]/')" >> "$GITHUB_OUTPUT"

  # ---------------------------------------------------------------- Linux
  # Builds each commit. A commit is built once: its program is kept in the cache, so a later
  # run that compares with it (the next commit's "previous", or "back10" ten commits later)
  # takes it from there. A build that is needed reuses the compiled objects of earlier builds
  # (ccache), so only the files a commit changed are compiled again.
  linux-build:
    name: linux-x86_64-build-${{ matrix.side }}
    needs: prepare
    if: needs.prepare.outputs.ready == '1'
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        side: ${{ fromJSON(needs.prepare.outputs.sides) }}
    env:
      COMMIT: ${{ matrix.side == 'previous' && needs.prepare.outputs.previous || matrix.side == 'back10' && needs.prepare.outputs.back10 || github.sha }}
      CCACHE_DIR: ${{ github.workspace }}/.ccache
      CCACHE_BASEDIR: ${{ github.workspace }}
      CCACHE_MAXSIZE: 1G
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7
        with:
          ref: ${{ env.COMMIT }}

      - name: Restore Program
        id: program
        uses: actions/cache/restore@v6
        with:
          path: program
          key: regression-program-linux-x86_64-${{ env.COMMIT }}

      - name: Install Dependencies
        if: steps.program.outputs.cache-hit != 'true'
        run: |
          ./.github/scripts/regression-linux-deps.sh
          sudo apt-get install -y ccache

      - name: Restore Compiler Cache
        if: steps.program.outputs.cache-hit != 'true'
        uses: actions/cache/restore@v6
        with:
          path: .ccache
          key: ccache-linux-x86_64-${{ env.COMMIT }}
          restore-keys: ccache-linux-x86_64-

      # program/packages.txt lists the packages the program links against, which the shard
      # jobs install to run it, and program/scenes.txt the names of its regression scenes (when
      # it can list them), which the shard jobs split into shards
      - name: Build Application
        if: steps.program.outputs.cache-hit != 'true'
        run: |
          ccache -z
          cd mandelbulber2
          PATH="/usr/lib/ccache:$PATH" ./deploy/linux/install --opencl --no-deps --no-install \
            --build-dir "$PWD/build" --jobs "$(nproc)"
          ccache -s
          cd ..
          mkdir -p program
          cp mandelbulber2/build/mandelbulber2 program/
          ldd program/mandelbulber2 | awk '/=> \//{print $3}' | while read -r library; do
            dpkg -S "*/$(basename "$library")" | grep -v "^diversion" | cut -d: -f1 | tr "," " "
          done | xargs -n1 | sort -u > program/packages.txt
          cat program/packages.txt
          program/mandelbulber2 --nogui --regression-list | sed -n "s/^scene: //p" > program/scenes.txt
          echo "$(grep -c . program/scenes.txt) regression scenes"

      - name: Save Compiler Cache
        if: steps.program.outputs.cache-hit != 'true' && matrix.side == 'head'
        uses: actions/cache/save@v6
        with:
          path: .ccache
          key: ccache-linux-x86_64-${{ env.COMMIT }}

      - name: Save Program
        if: steps.program.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: program
          key: regression-program-linux-x86_64-${{ env.COMMIT }}

      - name: Upload Program
        uses: actions/upload-artifact@v7
        with:
          name: program-linux-x86_64-${{ matrix.side }}
          path: program/
          if-no-files-found: error
          retention-days: 1

  # One job per shard renders the shard's scenes once with the head build, and twice with each
  # older build (the two renders give each scene's noise), then compares head with each.
  linux-shard:
    name: linux-x86_64-${{ matrix.shard }}
    needs: [prepare, linux-build]
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        shard: ${{ fromJSON(needs.prepare.outputs.linux) }}
    env:
      SHARD_INDEX: ${{ matrix.shard }}
      COMPARISONS: ${{ join(fromJSON(needs.prepare.outputs.comparisons), ' ') }}
    steps:
      # the scenes and the scripts
      - name: Checkout Code
        uses: actions/checkout@v7
        with:
          sparse-checkout: |
            .github
            mandelbulber2/deploy/share

      - name: Download Programs
        uses: actions/download-artifact@v8
        with:
          pattern: program-linux-x86_64-*
          path: programs

      # only the libraries the programs run with, not the build tools
      - name: Install Dependencies
        run: |
          sudo apt-get -qq update
          sort -u programs/*/packages.txt |
            xargs sudo apt-get install -y -qq --no-install-recommends --no-upgrade

      # Each program finds the scenes in ../share/mandelbulber2 beside it. The shards hold
      # scenes of about equal render time (regression-balance.sh with regression-times.txt)
      # when every program can render a list of scenes; older programs split the scenes in
      # turn (scene i in shard i mod N + 1).
      - name: Render and Compare
        run: |
          pairs=()
          balanced=1
          for side in head $COMPARISONS; do
            mkdir -p "run-$side/bin" "run-$side/share"
            cp "programs/program-linux-x86_64-$side/mandelbulber2" "run-$side/bin/"
            chmod +x "run-$side/bin/mandelbulber2"
            ln -s "$PWD/mandelbulber2/deploy/share/mandelbulber2" "run-$side/share/mandelbulber2"
            [ "$side" = head ] || pairs+=("$side=run-$side/bin/mandelbulber2")
            grep -qa -- regression-scenes "run-$side/bin/mandelbulber2" || balanced=0
          done
          selection="$SHARD_INDEX/$LINUX_SHARDS"
          if [ "$balanced" = 1 ] && [ -s programs/program-linux-x86_64-head/scenes.txt ]; then
            ./.github/scripts/regression-balance.sh programs/program-linux-x86_64-head/scenes.txt \
              .github/regression-times.txt "$LINUX_SHARDS" "$SHARD_INDEX" > shard-scenes.txt
            selection="$PWD/shard-scenes.txt"
          else
            echo "An older program can't render a list of scenes, so the scenes are split in turn"
          fi
          ./.github/scripts/regression-shard.sh run-head/bin/mandelbulber2 \
            "$selection" regression "${pairs[@]}"

      - name: Upload Reports
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: report-linux-x86_64-${{ matrix.shard }}
          path: regression/*/comparison/report.txt
          if-no-files-found: ignore

      - name: Upload Images
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: images-linux-x86_64-${{ matrix.shard }}
          path: regression/
          if-no-files-found: ignore

  # ---------------------------------------------------------------- summary
  summary:
    name: summary
    needs: [prepare, linux-shard]
    # not for a cancelled run, which a newer push replaces
    if: ${{ !cancelled() && needs.prepare.outputs.ready == '1' }}
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Download Reports
        uses: actions/download-artifact@v8
        with:
          pattern: report-*
          path: reports

      - name: Summarize
        run: ./.github/scripts/regression-summary.sh reports >> "$GITHUB_STEP_SUMMARY"

      - name: Check Result
        run: |
          echo "linux shards: ${{ needs.linux-shard.result }}"
          [ "${{ needs.linux-shard.result }}" = success ]
