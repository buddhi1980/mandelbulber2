name: macOS

# macOS build and package, without Homebrew. Like the CircleCI macos jobs
# (.circleci/config.yml) it builds mandelbulber-opencl-mac.pro, packs the
# app bundle with macdeployqt and keeps the zipped bundle and the disk image
# as artifacts.
#
# One job per kind of Mac hardware: Apple Silicon (arm64) and Intel (x86_64).
#
# mandelbulber2/mac/build_deps.sh builds the libraries from source for the
# deployment target below and installs Qt's official build, so the packages
# also run on Macs with an older macOS than the runner's. That takes a while,
# so the result is cached and only rebuilt when build_deps.sh changes.

on:
  push:
    branches:
      - '**'
    tags-ignore:
      - 'continuous*'
      - 'Continuous*'
  pull_request:
  workflow_dispatch:

concurrency:
  group: macos-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # oldest macOS the packages run on; Qt 6.7 does not go below 11
  MACOSX_DEPLOYMENT_TARGET: '11.0'

jobs:
  # job names match the CircleCI jobs: <system>-<architecture>
  macos:
    name: macos-${{ matrix.arch }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            hardware: Apple Silicon
            arch: arm64
          - os: macos-15-intel
            hardware: Intel
            arch: x86_64
    env:
      ARCH: ${{ matrix.arch }}
      DEPS: ${{ github.workspace }}/mac-deps
      PACKAGE: mandelbulber2-macOS-${{ matrix.arch }}-${{ github.sha }}

    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Show Build Environment
        run: |
          sw_vers
          uname -m
          xcodebuild -version

      - name: Cache Dependencies
        id: deps-cache
        uses: actions/cache@v6
        with:
          path: mac-deps
          key: mac-deps-${{ matrix.arch }}-macos${{ env.MACOSX_DEPLOYMENT_TARGET }}-${{ hashFiles('mandelbulber2/mac/build_deps.sh') }}

      - name: Dependencies
        if: steps.deps-cache.outputs.cache-hit != 'true'
        run: mandelbulber2/mac/build_deps.sh "$DEPS"

      - name: Build & Pack
        run: mandelbulber2/mac/build_package.sh "$DEPS" build "$PACKAGE"

      # Regression test: builds the commit before this change as well, renders
      # the regression scenes with both builds and compares them; see
      # .github/scripts/regression-compare.sh
      - name: Regression Test
        run: >
          .github/scripts/regression-compare.sh
          "$PWD/build/mandelbulber2.app/Contents/MacOS/mandelbulber2"
          "${{ github.event.pull_request.base.sha || github.event.before }}"

      - name: Upload Regression Images
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: regression-macos-${{ matrix.arch }}
          path: regression/
          if-no-files-found: ignore

      # archive: false uploads the file itself rather than a zip around it
      - name: Upload App Bundle
        uses: actions/upload-artifact@v7
        with:
          path: build/artifacts/${{ env.PACKAGE }}.zip
          archive: false
          if-no-files-found: error

      - name: Upload Disk Image
        uses: actions/upload-artifact@v7
        with:
          path: build/artifacts/${{ env.PACKAGE }}.dmg
          archive: false
          if-no-files-found: error
