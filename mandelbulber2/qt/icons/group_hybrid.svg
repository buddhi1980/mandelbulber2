<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <!-- Przestrzenny gradient z ukośnym błyskiem odwzorowujący styl oryginalnej ikony -->
    <linearGradient id="glossyPurple" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#bba2df" />
      <stop offset="25%" stop-color="#d9cbef" />
      <!-- Jasny refleks (błysk) przechodzący przez środek -->
      <stop offset="45%" stop-color="#ffffff" />
      <stop offset="55%" stop-color="#b399db" />
      <stop offset="100%" stop-color="#8363b9" />
    </linearGradient>
  </defs>

  <!-- Kształt litery H z ciemnofioletowym obramowaniem 3D -->
  <path d="M 22 15 
           H 38 
           V 42 
           H 62 
           V 15 
           H 78 
           V 85 
           H 62 
           V 58 
           H 38 
           V 85 
           H 22 
           Z" 
        fill="url(#glossyPurple)" 
        stroke="#4a2f70" 
        stroke-width="4" 
        stroke-linejoin="round" />
</svg>
